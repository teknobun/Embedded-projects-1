<!DOCTYPE HTML>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Wroom Wroom!</title>  
	<meta name="viewport" content="width=device-width, initial-scale=1"> 
	<link rel="icon" href="favicon.ico">
	<link rel="stylesheet" type="text/css" href="style.css">
	<script src="script.js" defer></script>	<!-- Defer ensures that page contents load first and JavaScript runs only after that -->
</head>	
<body>	
	<h1>Motor Control</h1>
	<form onsubmit="setSpeed(this.elements.pwm.valueAsNumber); return false;">
	<label>
		Speed (0-255)
		<input type="number" name="pwm" min="0" max="255" step="1" value="200" required>
	</label>
	<button type="submit">Submit</button>
</form>
	<div class="container">	<!-- This is a box that holds the buttons. -->
		<button class="button" onclick="forwards10()">FORWARDS<br>10cm</button> <!-- The onclick="forwards5()" tells the page to run the forwards5() function in the JavaScript when the button is clicked -->
		<button class="button" onclick="forwards50()">FORWARDS<br>50cm</button>
		<button class="button button2" onclick="backwards10()">BACKWARDS<br>10cm</button>
		<button class="button button2" onclick="backwards50()">BACKWARDS<br>50cm</button>
	</div>
	<div class="compass-directions">
    <button class="button button3" onclick="findnorth()">N</button>

    <div class="compass-middle">
        <button class="button button3" onclick="findwest()">W</button>
        <button class="button button3" onclick="findeast()">E</button>
    </div>

    <button class="button button3" onclick="findsouth()">S</button>
	</div>
	<h1>Compass Control</h1>
		<!-- Below is a code row for a slider you can drag left or right. 
		It lets you choose a number between -360 and 360, with steps of 5. 
		When you move the slider, it calls the updateCompass() function, 
		and when you finish pressing and/or moving the mouse button, it calls the sendCompassValue() function.-->
		<input type="range" min="-360" max="360" step="5" id="compassSlider" oninput="updateCompass(this.value)" onchange="sendCompassValue(this.value)" value="0"/>	
		<div id="compassValue">0°</div>		<!-- This shows the current/last requested compass turning value -->
		<button type="button"
        onclick="sendCompassValue(compassSlider.value)">
    Repeat turn
</button>
</body>
</html>

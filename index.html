<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Page Basics & SVG</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="header">
    <div class="logo">Course Expectations & Wishes</div>
    
    <nav class="nav-links">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>

    <button class="menu" aria-label="Toggle Navigation">Menu</button>
  </header>

  <main class="content">
    <section>
      <h2>My Course Expectations</h2>
      <ul>
        <li>Gain a solid understanding of modern web frontend development.</li>
        <li>Learn how to structure CSS clean and responsively.</li>
        <li>Build hands-on experience with frontend frameworks and UI libraries.</li>
      </ul>
    </section>

    <section class="svg">
      <h2>Airplane Graphic (SVG)</h2>
      <svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M 50 10 C 45 25, 45 70, 50 90 C 55 70, 55 25, 50 10 Z" fill="#2B3A42" />
        <polygon points="50,40 5,65 15,70 50,52" fill="#3F51B5" />
        <polygon points="50,40 95,65 85,70 50,52" fill="#3F51B5" />
        <polygon points="50,75 25,88 30,92 50,85" fill="#303F9F" />
        <polygon points="50,75 75,88 70,92 50,85" fill="#303F9F" />
      </svg>
    </section>
  </main>

</body>
</html>
